{% extends "base.html" %}
{% block title %}Reset Password — MyWealthLens{% endblock %}

{% block content %}
<div class="auth-card">

  <!-- Branding -->
  <div style="text-align:center; margin-bottom:32px;">
    <div style="font-family:'Roboto Mono',monospace; font-size:1.15rem; font-weight:700; letter-spacing:0.04em;">
      <span style="color:var(--accent);">MyWealth</span><span style="color:var(--muted2);">Lens</span>
    </div>
    <div style="color:var(--muted2); font-size:0.72rem; margin-top:6px; letter-spacing:0.1em; text-transform:uppercase;">
      Your complete financial picture
    </div>
  </div>

  <div class="auth-title" style="text-align:center;">Choose a new password</div>
  <div class="auth-subtitle" style="text-align:center;">
    This link is valid for a limited time and can only be used once
  </div>

  <form method="POST" action="{{ url_for('reset_password', token=token) }}" id="resetForm" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="form-group">
      <label for="password">New Password</label>
      <div class="input-wrapper">
        <input type="password" id="password" name="password"
               placeholder="Minimum 8 characters"
               required autocomplete="new-password" minlength="8"
               oninput="checkStrength(this.value); clearErr('password')" />
        <button type="button" class="toggle-pw" onclick="togglePw('password',this)">Show</button>
      </div>
      <!-- Strength meter -->
      <div style="margin-top:8px;">
        <div style="height:4px; background:var(--border); border-radius:2px; overflow:hidden;">
          <div id="strengthBar" style="height:4px; width:0%; border-radius:2px; transition:width 0.3s, background 0.3s;"></div>
        </div>
        <div id="strengthLabel" style="font-size:0.72rem; color:var(--muted2); margin-top:4px; min-height:16px;"></div>
      </div>
      <div class="field-error" id="err-password"></div>
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm New Password</label>
      <div class="input-wrapper">
        <input type="password" id="confirm_password" name="confirm_password"
               placeholder="Repeat your new password"
               required autocomplete="new-password" minlength="8"
               oninput="clearErr('confirm')" />
        <button type="button" class="toggle-pw" onclick="togglePw('confirm_password',this)">Show</button>
      </div>
      <div class="field-error" id="err-confirm"></div>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn" style="margin-top:8px;">
      Reset password
    </button>

  </form>

  <div class="auth-footer" style="margin-top:24px;">
    <a href="/login">Back to login</a>
  </div>

</div>

<style>
  .field-error { font-size:0.78rem; color:var(--down); margin-top:5px; min-height:16px; }
  #submitBtn:disabled { opacity:0.6; cursor:not-allowed; }
</style>

<script>
  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    const hidden = inp.type === 'password';
    inp.type = hidden ? 'text' : 'password';
    btn.textContent = hidden ? 'Hide' : 'Show';
  }

  function clearErr(field) {
    const el = document.getElementById('err-' + field);
    if (el) el.textContent = '';
  }

  function checkStrength(val) {
    const bar   = document.getElementById('strengthBar');
    const label = document.getElementById('strengthLabel');
    if (!val) { bar.style.width = '0%'; label.textContent = ''; return; }

    let score = 0;
    if (val.length >= 8)               score++;
    if (val.length >= 12)              score++;
    if (/[A-Z]/.test(val))            score++;
    if (/[0-9]/.test(val))            score++;
    if (/[^A-Za-z0-9]/.test(val))    score++;

    const levels = [
      { pct:'20%', color:'#DC2626', text:'Very weak'   },
      { pct:'40%', color:'#EA580C', text:'Weak'        },
      { pct:'60%', color:'#D97706', text:'Fair'        },
      { pct:'80%', color:'#65A30D', text:'Strong'      },
      { pct:'100%',color:'#16A34A', text:'Very strong' },
    ];
    const lvl = levels[Math.min(score - 1, 4)] || levels[0];
    bar.style.width      = lvl.pct;
    bar.style.background = lvl.color;
    label.style.color    = lvl.color;
    label.textContent    = lvl.text;
  }

  document.getElementById('resetForm').addEventListener('submit', function(e) {
    let valid = true;
    const pw  = document.getElementById('password').value;
    const cpw = document.getElementById('confirm_password').value;

    if (pw.length < 8) {
      document.getElementById('err-password').textContent = 'Password must be at least 8 characters.';
      valid = false;
    }
    if (pw !== cpw) {
      document.getElementById('err-confirm').textContent = 'Passwords do not match.';
      valid = false;
    }
    if (!valid) { e.preventDefault(); return; }

    const btn = document.getElementById('submitBtn');
    btn.textContent = 'Resetting…';
    btn.disabled = true;
  });
</script>
{% endblock %}
