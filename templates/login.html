{% extends "base.html" %}
{% block title %}Login — MyWealthLens{% endblock %}

{% block content %}
<div class="auth-card">

  <div style="text-align:center; margin-bottom:28px;">
    <div style="font-family:'Roboto Mono',monospace; font-size:1.1rem; font-weight:600;">
      <span style="color:#00d4aa;">MyWealth</span><span style="color:#64748b;">Lens</span>
    </div>
    <div style="color:#64748b; font-size:0.75rem; margin-top:4px; letter-spacing:0.08em; text-transform:uppercase;">
      Your complete financial picture
    </div>
  </div>

  <div class="auth-title">Welcome back</div>
  <div class="auth-subtitle">Log in to your account to continue</div>

  <form method="POST" action="/login">

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">Show</button>
      </div>
    </div>

    <button type="submit" class="btn-primary">Log in</button>

  </form>

  <div class="auth-footer">
    Don't have an account? <a href="/signup">Sign up free</a>
  </div>

</div>

<script>
  function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === "password") {
      input.type = "text";
      btn.textContent = "Hide";
    } else {
      input.type = "password";
      btn.textContent = "Show";
    }
  }
</script>
{% endblock %}
