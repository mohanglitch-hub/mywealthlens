{% extends "base.html" %}
{% block title %}Forgot Password — MyWealthLens{% endblock %}

{% block content %}
<div class="auth-card">

  <!-- Branding -->
  <div style="text-align:center; margin-bottom:32px;">
    <div style="font-family:'Roboto Mono',monospace; font-size:1.15rem; font-weight:700; letter-spacing:0.04em;">
      <span style="color:var(--accent);">MyWealth</span><span style="color:var(--muted2);">Lens</span>
    </div>
    <div style="color:var(--muted2); font-size:0.72rem; margin-top:6px; letter-spacing:0.1em; text-transform:uppercase;">
      Your complete financial picture
    </div>
  </div>

  <!-- Lock icon -->
  <div style="text-align:center; margin-bottom:20px;">
    <div style="display:inline-flex; align-items:center; justify-content:center;
                width:56px; height:56px; border-radius:16px;
                background:var(--accent-bg); border:1px solid var(--border);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
           stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
  </div>

  <div class="auth-title" style="text-align:center;">Forgot your password?</div>
  <div class="auth-subtitle" style="text-align:center;">
    Enter your email and we'll send you a reset link
  </div>

  <form method="POST" action="/forgot-password" id="forgotForm" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />


    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email"
             placeholder="you@example.com"
             required autocomplete="email"
             oninput="clearErr('email')" />
      <div class="field-error" id="err-email"></div>
    </div>

    <button type="submit" class="btn-primary" id="sendBtn">
      Send reset link
    </button>

  </form>

  <!-- Divider -->
  <div style="display:flex; align-items:center; gap:12px; margin:24px 0 0;">
    <div style="flex:1; height:1px; background:var(--border);"></div>
    <span style="font-size:0.75rem; color:var(--muted2);">or</span>
    <div style="flex:1; height:1px; background:var(--border);"></div>
  </div>

  <div class="auth-footer" style="margin-top:16px;">
    Remember your password? <a href="/login">Back to login</a>
  </div>

</div>

<style>
  .field-error { font-size:0.78rem; color:var(--down); margin-top:5px; min-height:16px; }
  #sendBtn:disabled { opacity:0.6; cursor:not-allowed; }
</style>

<script>
  function clearErr(field) {
    const el = document.getElementById('err-' + field);
    if (el) el.textContent = '';
  }

  document.getElementById('forgotForm').addEventListener('submit', function(e) {
    const email = document.getElementById('email').value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('err-email').textContent = 'Please enter a valid email address.';
      e.preventDefault();
      return;
    }
    const btn = document.getElementById('sendBtn');
    btn.textContent = 'Sending…';
    btn.disabled = true;
  });

  window.addEventListener('DOMContentLoaded', function() {
    document.getElementById('email').focus();
  });
</script>
{% endblock %}
